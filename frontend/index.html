<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face &rarr; Reverse Search &rarr; Blockchain Verification</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>Face &rarr; Reverse Search &rarr; Blockchain Verification</h1>
    <p class="subtitle">Upload a photo. A real reverse image search finds a matching post, and its fingerprint is written to and re-verified against a local blockchain &mdash; live, no mocked steps.</p>

    <form id="upload-form">
      <input type="file" id="file-input" accept="image/*" required />
      <label class="auto-toggle">
        <input type="checkbox" id="auto-toggle" />
        Auto-select top match (skip manual pick)
      </label>
      <button type="submit">Run pipeline</button>
    </form>

    <div id="error-banner" class="error-banner" hidden></div>

    <section id="stages" class="stages"></section>

    <section id="candidates" class="candidates" hidden></section>

    <section id="result" class="result" hidden></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
