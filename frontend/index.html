<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Was This You?</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>Was This You?</h1>
    <p class="tagline">Find where a photo has been reused, and prove whether the record still matches.</p>

    <form id="upload-form" class="upload-card">
      <label class="dropzone" for="file-input" id="dropzone">
        <img id="preview-img" class="preview-img" hidden alt="Selected photo preview" />
        <span id="dropzone-text" class="dropzone-text">Choose a photo to check</span>
      </label>
      <input type="file" id="file-input" accept="image/*" required hidden />
      <button type="submit" id="submit-btn"><span id="submit-label">Start verification</span></button>
    </form>

    <div id="error-banner" class="error-banner" hidden></div>

    <div id="step-indicator" class="step-indicator" hidden>
      <span class="step" data-step="face">Face Scan</span>
      <span class="step" data-step="web">Web Search</span>
      <span class="step" data-step="chain">Blockchain</span>
    </div>

    <section id="trace" class="trace"></section>

    <section id="reverify-panel" class="reverify-panel" hidden>
      <h2>Re-verify</h2>
      <p class="reverify-hint">Edit the source URL or caption below to simulate tampering, then re-verify against the blockchain record independently.</p>
      <label class="field">
        <span>Source URL</span>
        <input type="text" id="reverify-url" />
      </label>
      <label class="field">
        <span>Caption</span>
        <textarea id="reverify-caption" rows="2"></textarea>
      </label>
      <button type="button" id="reverify-btn">Re-verify</button>
      <div id="reverify-result" class="reverify-result"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
